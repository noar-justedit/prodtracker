appId: fr.just-edit.prodtracker
productName: prodtracker
copyright: "Copyright © 2026 Just Edit"
compression: maximum
asar: true

directories:
  buildResources: build-resources

files:
  - src/**/*
  - package.json
  - LICENSE
  - build-resources/*.ico
  - build-resources/*.icns
  - build-resources/*.png

mac:
  category: public.app-category.productivity
  icon: build-resources/icon.png
  # Signing + notarization. The Developer ID Application certificate is picked up
  # from the login keychain automatically (override with CSC_NAME if several match).
  # Notarization is triggered by electron-builder as soon as credentials are found
  # in the environment - scripts/build-mac.sh exports APPLE_KEYCHAIN_PROFILE.
  # With no certificate and no credentials, the build still runs and produces an
  # unsigned .dmg.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  notarize: true
  target:
    - target: dmg
      arch:
        - arm64

dmg:
  title: "prodtracker"
  writeUpdateInfo: false
  # Ne pas mettre "sign: true" ici. electron-builder signerait bien le .dmg, mais
  # sans --timestamp, et Apple refuse de notariser une signature sans horodatage
  # securise. scripts/build-mac.sh signe l'image disque lui-meme, avec timestamp,
  # juste avant de l'envoyer a la notarisation.
  icon: null
  # electron-builder auto-detects build-resources/license_en.txt (and license_<lang>.txt
  # variants) as the DMG license agreement by filename convention. There is no "license"
  # key under dmg in this version's schema - do not add one, it fails validation.
  window:
    width: 540
    height: 400
  contents:
    - x: 150
      y: 190
      type: file
    - x: 390
      y: 190
      type: link
      path: /Applications

win:
  icon: build-resources/icon.ico
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  license: build-resources/license_en.txt
  installerLanguages:
    - fr_FR
    - en_US
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: prodtracker
